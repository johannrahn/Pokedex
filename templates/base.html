<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pokédex — Explora información detallada de todos los Pokémon.">
    <title>{% block title %}Pokédex{% endblock %}</title>

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    {% block head %}{% endblock %}
</head>

<body>
    <div id="global-weather-bg" class="global-weather-bg"></div>

    <!-- ── Who's That Pokemon? Widget ────────────────────────── -->
    <div id="wtp-widget" class="wtp-widget">
        <div class="wtp-header">
            <span class="wtp-qmark">?</span>
            <span class="wtp-title-text">¿Quién es ese Pokémon?</span>
        </div>
        <div class="wtp-body">
            <div id="wtp-silhouette-container" class="wtp-silhouette-container">
                <img id="wtp-silhouette" src="" alt="Silhouette" class="wtp-silhouette">
            </div>
            <div id="wtp-controls" class="wtp-controls">
                <input type="text" id="wtp-input" placeholder="Adivina..." autocomplete="off">
                <button id="wtp-btn">Ok</button>
            </div>
            <div id="wtp-result" class="wtp-result"></div>
        </div>
        <button id="wtp-toggle" class="wtp-toggle">?</button>
    </div>

    <!-- ── Navbar ─────────────────────────────────────────────── -->
    <nav class="navbar">
        <div class="navbar-container">

            <!-- Brand -->
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <span class="pokeball-icon">◓</span>
                Pokédex
            </a>

            <!-- Nav links -->
            <ul class="navbar-nav">
                <li><a class="nav-link" href="{{ url_for('index') }}">Explorar</a></li>
                <li><a class="nav-link nav-link-battle" href="{{ url_for('batalla') }}">⚔️ Batalla</a></li>
                <li><a class="nav-link nav-link-league" href="{{ url_for('liga') }}">🏆 La Liga</a></li>
            </ul>

            <!-- Spacer -->
            <div class="navbar-spacer"></div>

            <!-- Search -->
            <form action="{{ url_for('search') }}" method="GET" role="search" class="navbar-search">
                <div class="search-wrapper">
                    <span class="search-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <input class="search-input" type="search" name="q" placeholder="Buscar Pokémon…" aria-label="Buscar"
                        id="search-input" autocomplete="off">
                </div>
                <button class="btn-search ripple-container" type="submit" id="search-btn">Buscar</button>
            </form>

        </div>
    </nav>

    <!-- ── Main Content ──────────────────────────────────────── -->
    <main style="max-width:1280px;margin:0 auto;padding:0 1.25rem">
        {% block content %}{% endblock %}
    </main>

    <!-- ── Footer ────────────────────────────────────────────── -->
    <footer>
        <div>
            Pokédex &mdash; Datos por
            <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokeAPI</a>
            &nbsp;·&nbsp; Diseño moderno ✦
        </div>
    </footer>

    <!-- JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
    {% block scripts %}{% endblock %}

</body>

</html>
