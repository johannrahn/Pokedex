{% extends "base.html" %}

{% block title %}Error {{ error_code }} — Pokédex{% endblock %}

{% block content %}
<div class="error-page">

    <div style="font-size:4rem;margin-bottom:1rem">
        {% if error_code == 404 %}🔍{% else %}⚡{% endif %}
    </div>

    <div class="error-code">{{ error_code }}</div>
    <h2 class="error-title">{{ error_title }}</h2>
    <p class="error-msg">{{ error_message }}</p>

    <a href="{{ url_for('index') }}" class="btn-back" style="font-size:0.9rem;padding:0.55rem 1.4rem">
        ← Volver al inicio
    </a>

</div>
{% endblock %}
